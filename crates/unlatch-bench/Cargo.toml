[package]
name = "unlatch-bench"
description = "Network lab (netns + netem), synthetic trees, benchmarks and verification harness for Unlatch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "unlatch-bench"
path = "src/main.rs"

[dependencies]
unlatch-proto.workspace = true
unlatch-core.workspace = true
anyhow.workspace = true
rand.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1"
rand_chacha = "0.3"
rand_distr = "0.4"
libc = "0.2"
# fpsim / fuzz
unicode-normalization = "0.1"
nix = { version = "0.29", features = ["socket", "uio", "signal", "process"] }
