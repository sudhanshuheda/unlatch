[package]
name = "unlatch-cli"
description = "unlatch command-line tool: agent, mount (FUSE), ls/stat/cat, doctor, probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "unlatch_cli"
path = "src/lib.rs"

[[bin]]
name = "unlatch"
path = "src/main.rs"

[dependencies]
unlatch-proto.workspace = true
unlatch-core.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"

# Pure-Rust FUSE (mounts through fusermount3; no libfuse / pkg-config needed).
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15.1", default-features = false, features = ["abi-7-31"] }

[dev-dependencies]
tempfile.workspace = true
